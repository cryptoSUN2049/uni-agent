# Operator-owned Task Config for the bounded dynamic-plugin evolution family.
# Dataset rows may provide scenario identity and prompt metadata, but cannot
# replace this profile, patch stack, Sandbox, verifier command, or generation
# budget.
- name: dsh_architecture
  sandbox:
    provider: local
    runtime_timeout: 1800
  agent:
    name: dsh
    model:
      max_total_tokens: 4096
      max_tokens_per_turn: 1024
    runner_python: python
    runner_module: uni_agent.agents.dsh.runner
    default_workdir: "."
    profile: sdk-minimal
    # The first Qwen3-4B proof disables hidden reasoning so tool-call
    # adherence and the verifier signal remain observable and reproducible.
    reasoning_effort: "off"
    patches:
      - examples/dsh/evolution.patch.yml
    provider: deepseek-official
    keep_trace: true
    run_timeout: 1800
  verifier_command:
    - python
    - -m
    - examples.dsh.evolution_verifier
  verifier_timeout: 300
  result_root: /tmp/uni-agent-dsh-task/results
  workdir: null
  require_trace: true
  environment_digest: null
  verifier_id: null
  verifier_version: null
  verifier_code_digest: sha256:6715dbe97e671ca9151a68ec7676bf00a35072f591b1dfacd3814db1b773e991
